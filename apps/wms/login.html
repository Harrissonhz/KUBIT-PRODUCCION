<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kubit WMS — Iniciar Sesion</title>
  <script>
    // Anti-flash: modo oscuro por defecto; solo se quita si el usuario lo apago
    if (localStorage.getItem('darkMode') === 'false') {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com" charset="UTF-8"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="img/icon-192x192.png">
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 p-4 transition-colors duration-300">
  <div class="w-full max-w-sm">
    <div class="text-center mb-10">
      <div class="w-14 h-14 bg-slate-950 dark:bg-white rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-sm">
        <span class="text-white dark:text-slate-950 text-2xl font-bold">K</span>
      </div>
      <h1 class="text-2xl font-semibold text-slate-950 dark:text-white">Kubit WMS</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Inicia sesion para continuar</p>
    </div>
    <form id="form-login" class="space-y-4" onsubmit="return false;">
      <div>
        <label for="email" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">Email</label>
        <input type="email" id="email" autocomplete="username" inputmode="email"
          class="w-full px-4 py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800 text-slate-950 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-950 dark:focus:ring-white/20 transition-all text-sm"
          placeholder="admin@ejemplo.com">
      </div>
      <div>
        <label for="password" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">Contrasena</label>
        <input type="password" id="password" autocomplete="current-password"
          class="w-full px-4 py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800 text-slate-950 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-950 dark:focus:ring-white/20 transition-all text-sm"
          placeholder="••••••••">
      </div>
      <div id="login-error" class="text-red-500 text-xs text-center hidden"></div>
      <button type="submit" id="btn-ingresar"
        class="w-full py-3.5 rounded-xl bg-slate-950 dark:bg-white text-white dark:text-slate-950 font-medium text-sm hover:bg-slate-800 dark:hover:bg-slate-100 transition-all active:scale-[0.98] shadow-sm">
        Ingresar
      </button>
    </form>
    <div class="mt-8 text-center">
      <button id="toggle-dark" class="text-xs text-slate-400 hover:text-slate-950 dark:hover:text-white transition-colors">
        Modo claro / oscuro
      </button>
    </div>
  </div>
  <script src="js/config.js" charset="UTF-8"></script>
  <script src="js/supabase.js" charset="UTF-8"></script>
  <script src="js/compartido/database.js" charset="UTF-8"></script>
  <script src="js/compartido/auth.js" charset="UTF-8"></script>
  <script src="js/paginas/login.js" charset="UTF-8"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
      navigator.serviceWorker.addEventListener('message', function (ev) {
        if (ev.data && ev.data.accion === 'recargar') location.reload();
      });
    }
  </script>
</body>
</html>
