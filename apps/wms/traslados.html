<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kubit WMS — Traslados</title>
  <!--
    PASOS B4-B5: Traslados (HU-06, decision T1).
    B4: digitar el contenedor de origen, validarlo y ver su contenido UBICADO;
        elegir el producto a mover.
    B5: digitar el contenedor de destino (validado en pantalla), la cantidad
        y confirmar el traslado (rpc wms_trasladar).
  -->
  <script>
    if (localStorage.getItem('darkMode') === 'false') {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com" charset="UTF-8"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] } } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/wms.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192x192.png">
</head>
<body data-pagina="traslados" data-titulo="Traslados"
  class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-950 dark:text-white font-sans">

  <main id="contenido" class="invisible px-4 max-w-xl mx-auto lg:max-w-3xl space-y-4">

    <!-- ===================== ORIGEN ===================== -->
    <section class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800 rounded-xl p-4">
      <label for="origen-codigo" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">Contenedor de origen</label>
      <input id="origen-codigo" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" placeholder="Ej. 30110"
        class="w-full px-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200/60 dark:border-slate-800 text-2xl text-center font-mono font-semibold tracking-[0.3em] focus:outline-none focus:ring-2 focus:ring-slate-950 dark:focus:ring-white/20">
      <div id="origen-info" class="mt-2 min-h-[2.5rem] text-xs text-slate-500 dark:text-slate-400">Digita el codigo del adhesivo de la bolsa, caja o zona suelta de donde vas a sacar.</div>
    </section>

    <!-- Contenido del origen -->
    <section id="origen-contenido" class="hidden">
      <div class="flex items-center justify-between mb-2">
        <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Contenido</p>
        <p id="origen-resumen" class="text-xs text-slate-500 dark:text-slate-400"></p>
      </div>
      <div id="origen-lista" class="space-y-2"></div>
    </section>

    <!-- ===================== PRODUCTO, DESTINO Y CANTIDAD ===================== -->
    <section id="seleccion" class="hidden bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800 rounded-xl p-4 space-y-4">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400">Producto a mover</p>
          <p id="sel-producto" class="text-sm font-medium mt-0.5"></p>
          <p id="sel-codigo" class="text-xs text-slate-500 dark:text-slate-400"></p>
        </div>
        <div class="text-right shrink-0">
          <p id="sel-cantidad" class="text-2xl font-semibold leading-none">0</p>
          <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">en el origen</p>
        </div>
      </div>

      <form id="form-traslado" class="space-y-4 pt-3 border-t border-slate-200/60 dark:border-slate-800" autocomplete="off">
        <div>
          <label for="destino-codigo" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">Contenedor de destino</label>
          <input id="destino-codigo" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="Ej. 30191"
            class="w-full px-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200/60 dark:border-slate-800 text-2xl text-center font-mono font-semibold tracking-[0.3em] focus:outline-none focus:ring-2 focus:ring-slate-950 dark:focus:ring-white/20">
          <div id="destino-info" class="mt-2 min-h-[2.5rem] text-xs text-slate-500 dark:text-slate-400"></div>
        </div>

        <div>
          <label for="cantidad" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">Cantidad</label>
          <div class="grid grid-cols-[3.25rem_1fr_3.25rem] gap-2">
            <button id="btn-menos" type="button" aria-label="Restar uno" class="py-3 rounded-xl text-xl font-semibold border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">−</button>
            <input id="cantidad" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5"
              class="w-full px-3 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200/60 dark:border-slate-800 text-xl text-center font-semibold focus:outline-none focus:ring-2 focus:ring-slate-950 dark:focus:ring-white/20">
            <button id="btn-mas" type="button" aria-label="Sumar uno" class="py-3 rounded-xl text-xl font-semibold border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">+</button>
          </div>
          <div class="mt-2 flex items-center justify-between gap-2">
            <p id="cant-info" class="text-xs text-slate-500 dark:text-slate-400"></p>
            <button id="btn-todo" type="button" class="text-xs font-medium underline underline-offset-2 text-slate-600 dark:text-slate-300">Todo</button>
          </div>
        </div>

        <button id="btn-mover" type="submit" disabled
          class="w-full py-3.5 rounded-xl bg-slate-950 dark:bg-white text-white dark:text-slate-950 font-medium text-sm hover:bg-slate-800 dark:hover:bg-slate-100 transition-all active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none">
          Mover
        </button>
      </form>

      <button id="btn-cambiar" type="button" class="text-sm text-slate-500 dark:text-slate-400 underline underline-offset-2 hover:text-slate-950 dark:hover:text-white">Elegir otro producto</button>
    </section>
  </main>

  <script src="js/config.js" charset="UTF-8"></script>
  <script src="js/supabase.js" charset="UTF-8"></script>
  <script src="js/compartido/database.js" charset="UTF-8"></script>
  <script src="js/compartido/auth.js" charset="UTF-8"></script>
  <script src="js/compartido/layout.js" charset="UTF-8"></script>
  <script src="js/compartido/ubicacion-vista.js" charset="UTF-8"></script>
  <script src="js/paginas/traslados.js" charset="UTF-8"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
      navigator.serviceWorker.addEventListener('message', function (ev) {
        if (ev.data && ev.data.accion === 'recargar') location.reload();
      });
    }
  </script>
</body>
</html>
