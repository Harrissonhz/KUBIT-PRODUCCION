<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kubit WMS — Configuracion</title>
  <!--
    PASO A7: Configuracion de bodegas y contenedores (HU-10).
    Regla de codigo (decision P1, 2026-10-01):  B CC PP
      B  = bodega 1-9
      CC = puesto 01-99: canastilla (piso) O entrepano (estanteria), nunca ambos
      PP = 01-90 bolsa/caja (1 producto) · 91-99 zona suelta (varios) · 00 el puesto
  -->
  <script>
    if (localStorage.getItem('darkMode') === 'false') {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com" charset="UTF-8"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] } } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/wms.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192x192.png">
</head>
<body data-pagina="config" data-titulo="Configuracion"
  class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-950 dark:text-white font-sans">

  <main id="contenido" class="invisible px-4 max-w-xl mx-auto lg:max-w-3xl space-y-4">

    <!-- Bodegas -->
    <section>
      <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wider">Bodega</p>
      <div id="bodegas" class="grid grid-cols-3 sm:grid-cols-4 gap-2"></div>
      <div id="panel-bodega" class="hidden mt-3"></div>
    </section>

    <!-- Nuevo puesto -->
    <section class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800 rounded-xl p-4">
      <p class="text-sm font-medium">Nuevo puesto</p>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Numero de 01 a 99, compartido entre canastillas y entrepanos de la bodega.</p>
      <form id="form-puesto" class="mt-3 space-y-3" autocomplete="off">
        <div class="grid grid-cols-2 gap-2" role="radiogroup" aria-label="Tipo de puesto">
          <label class="cursor-pointer">
            <input type="radio" name="tipo-puesto" value="CANASTILLA" class="peer sr-only" checked>
            <span class="block text-center px-3 py-2.5 rounded-xl text-sm font-medium border border-slate-200 dark:border-slate-700 peer-checked:bg-slate-950 peer-checked:text-white peer-checked:border-slate-950 dark:peer-checked:bg-white dark:peer-checked:text-slate-950 dark:peer-checked:border-white">Canastilla</span>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="tipo-puesto" value="ENTREPANO" class="peer sr-only">
            <span class="block text-center px-3 py-2.5 rounded-xl text-sm font-medium border border-slate-200 dark:border-slate-700 peer-checked:bg-slate-950 peer-checked:text-white peer-checked:border-slate-950 dark:peer-checked:bg-white dark:peer-checked:text-slate-950 dark:peer-checked:border-white">Entrepano</span>
          </label>
        </div>
        <div class="grid grid-cols-[6rem_1fr] gap-3">
          <div>
            <label for="puesto-numero" class="block text-xs text-slate-500 dark:text-slate-400 mb-1">Numero</label>
            <input id="puesto-numero" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2"
              class="w-full px-3 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200/60 dark:border-slate-800 text-base text-center font-semibold focus:outline-none focus:ring-2 focus:ring-slate-950 dark:focus:ring-white/20">
          </div>
          <div>
            <label for="puesto-nombre" class="block text-xs text-slate-500 dark:text-slate-400 mb-1">Nombre (opcional)</label>
            <input id="puesto-nombre" type="text" maxlength="60" placeholder="Ej. Canastilla azul"
              class="w-full px-3 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200/60 dark:border-slate-800 text-base focus:outline-none focus:ring-2 focus:ring-slate-950 dark:focus:ring-white/20">
          </div>
        </div>
        <div class="flex items-center justify-between gap-3">
          <p class="text-sm">Codigo: <span id="puesto-codigo" class="font-semibold tracking-wider">-----</span></p>
          <button id="btn-crear-puesto" type="submit"
            class="px-5 py-2.5 rounded-xl bg-slate-950 dark:bg-white text-white dark:text-slate-950 text-sm font-medium hover:bg-slate-800 dark:hover:bg-slate-100 transition-all active:scale-[0.98]">
            Crear
          </button>
        </div>
        <p id="puesto-error" class="hidden text-xs text-red-500"></p>
      </form>
    </section>

    <!-- Puestos de la bodega -->
    <section>
      <div class="flex items-center justify-between mb-2">
        <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Puestos</p>
        <p id="resumen" class="text-xs text-slate-500 dark:text-slate-400 text-right"></p>
      </div>
      <!-- M1: buscar, expandir/colapsar y leyenda -->
      <div class="space-y-2 mb-3">
        <div class="flex gap-2">
          <input id="buscar-puesto" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off"
            placeholder="Ir a puesto o contenedor (ej. 10300 o 10393)"
            class="flex-1 min-w-0 px-3 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800 text-base focus:outline-none focus:ring-2 focus:ring-slate-950 dark:focus:ring-white/20">
        </div>
        <p id="buscar-msg" class="hidden text-xs text-red-500"></p>
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <div class="flex flex-wrap items-center gap-1.5 text-[11px]" aria-label="Leyenda">
            <span class="px-2 py-1 rounded-md bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200">Con producto</span>
            <span class="px-2 py-1 rounded-md bg-amber-50 text-amber-800 dark:bg-amber-950/40 dark:text-amber-300">Suelto</span>
            <span class="wms-libre px-2 py-1 rounded-md border border-transparent"><span aria-hidden="true">&#9675;</span> Libre</span>
          </div>
          <div class="flex gap-2">
            <button id="btn-expandir-todo" type="button" class="px-3 py-1.5 rounded-lg text-xs border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">Expandir todo</button>
            <button id="btn-colapsar-todo" type="button" class="px-3 py-1.5 rounded-lg text-xs border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">Colapsar todo</button>
          </div>
        </div>
      </div>
      <div id="lista" class="space-y-3"></div>
    </section>
  </main>

  <script src="js/config.js" charset="UTF-8"></script>
  <script src="js/supabase.js" charset="UTF-8"></script>
  <script src="js/compartido/database.js" charset="UTF-8"></script>
  <script src="js/compartido/auth.js" charset="UTF-8"></script>
  <script src="js/compartido/layout.js" charset="UTF-8"></script>
  <script src="js/paginas/config.js" charset="UTF-8"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
      navigator.serviceWorker.addEventListener('message', function (ev) {
        if (ev.data && ev.data.accion === 'recargar') location.reload();
      });
    }
  </script>
</body>
</html>
