<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kubit WMS — Inventario</title>
  <!--
    PASO C2: Inventario general / conteo (HU-09, reglas CR1 y CR3).
    1. Digitar el contenedor; ver lo que el WMS espera (ubicado + reservado).
    2. Registrar lo contado por producto (y agregar productos encontrados).
    3. Mayor: se ubica lo que haya sin ubicar; el sobrante real queda pendiente
       hasta registrar un ajuste + en el POS. Menor: lo que falta vuelve a sin ubicar.
    4. Sobrantes pendientes: ubicarlos (tras el ajuste + en el POS) o descartarlos.
    El POS no se modifica.
  -->
  <script>
    if (localStorage.getItem('darkMode') === 'false') {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com" charset="UTF-8"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] } } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/wms.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192x192.png">
</head>
<body data-pagina="inventario" data-titulo="Inventario"
  class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-950 dark:text-white font-sans">

  <main id="contenido" class="invisible px-4 max-w-xl mx-auto lg:max-w-3xl space-y-4">

    <p id="estado-sync" class="text-xs text-slate-500 dark:text-slate-400">Sincronizando con el POS...</p>

    <!-- ===================== CONTENEDOR ===================== -->
    <section class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800 rounded-xl p-4">
      <label for="cont-codigo" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">Contenedor a contar</label>
      <input id="cont-codigo" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" placeholder="Ej. 30110"
        class="w-full px-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200/60 dark:border-slate-800 text-2xl text-center font-mono font-semibold tracking-[0.3em] focus:outline-none focus:ring-2 focus:ring-slate-950 dark:focus:ring-white/20">
      <div id="cont-info" class="mt-2 min-h-[2.5rem] text-xs text-slate-500 dark:text-slate-400">Digita el codigo del adhesivo de la bolsa, caja o zona suelta que vas a contar.</div>
    </section>

    <!-- ===================== CONTEO ===================== -->
    <section id="seccion-conteo" class="hidden space-y-3">
      <div class="flex items-center justify-between">
        <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Cuenta lo que hay fisicamente</p>
        <p id="conteo-resumen" class="text-xs text-slate-500 dark:text-slate-400"></p>
      </div>
      <div id="conteo-lista" class="space-y-2"></div>

      <!-- Agregar un producto encontrado -->
      <div id="agregar-wrap" class="rounded-xl border border-dashed border-slate-300 dark:border-slate-700 p-3">
        <button id="btn-agregar" type="button" class="w-full text-sm font-medium text-slate-700 dark:text-slate-200">+ Agregar un producto que encontraste aqui</button>
        <div id="buscar-wrap" class="hidden mt-3 space-y-2">
          <input id="buscar-producto" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
            class="w-full px-3 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200/60 dark:border-slate-800 text-base focus:outline-none focus:ring-2 focus:ring-slate-950 dark:focus:ring-white/20"
            placeholder="Codigo o nombre del producto">
          <div id="buscar-resultados" class="space-y-1"></div>
        </div>
        <p id="agregar-aviso" class="hidden mt-2 text-xs text-slate-500 dark:text-slate-400"></p>
      </div>

      <button id="btn-registrar" type="button" disabled
        class="w-full py-3.5 rounded-xl bg-slate-950 dark:bg-white text-white dark:text-slate-950 font-medium text-sm hover:bg-slate-800 dark:hover:bg-slate-100 transition-all active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none">
        Registrar conteo
      </button>
      <button id="btn-otro" type="button" class="hidden w-full py-3 rounded-xl text-sm font-medium border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
        Contar otro contenedor
      </button>
    </section>

    <!-- ===================== SOBRANTES PENDIENTES ===================== -->
    <section class="pt-2">
      <div class="flex items-center justify-between mb-2">
        <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Sobrantes pendientes</p>
        <p id="sobrantes-resumen" class="text-xs text-slate-500 dark:text-slate-400"></p>
      </div>
      <div id="sobrantes-lista" class="space-y-2"></div>
    </section>
  </main>

  <script src="js/config.js" charset="UTF-8"></script>
  <script src="js/supabase.js" charset="UTF-8"></script>
  <script src="js/compartido/database.js" charset="UTF-8"></script>
  <script src="js/compartido/auth.js" charset="UTF-8"></script>
  <script src="js/compartido/layout.js" charset="UTF-8"></script>
  <script src="js/compartido/fecha.js" charset="UTF-8"></script>
  <script src="js/compartido/ubicacion-vista.js" charset="UTF-8"></script>
  <script src="js/paginas/inventario.js" charset="UTF-8"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
      navigator.serviceWorker.addEventListener('message', function (ev) {
        if (ev.data && ev.data.accion === 'recargar') location.reload();
      });
    }
  </script>
</body>
</html>
